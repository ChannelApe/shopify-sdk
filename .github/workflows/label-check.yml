name: "Label Check"
on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]

jobs:
  enforce-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check for labels
        run: |
          if [ "${{ github.event.pull_request.labels[0].name }}" == "" ]; then
            echo "No labels found! Please add a label to this PR."
            exit 1
          fi    
